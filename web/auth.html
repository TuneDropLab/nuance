<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nuance — Authenticating</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #3D9261;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px 0;
      letter-spacing: -0.4px;
    }
    p {
      color: #8E8E93;
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 id="status-title">Signing in to Nuance</h2>
    <p id="status-desc">Authenticating your account, please wait...</p>
    <button id="return-btn" style="display:none; margin-top:20px; padding:10px 20px; border-radius:10px; background:#3D9261; color:#fff; border:none; font-weight:600; cursor:pointer;" onclick="manualReturn()">Return to Nuance</button>
  </div>

  <script>
    (function() {
      var currentUrl = window.location.href;
      var message = {
        'flutter-web-auth': currentUrl,
        'flutter-web-auth-2': currentUrl
      };

      // 1. Multi-channel dispatch: BroadcastChannel
      try {
        var bc = new BroadcastChannel('nuance_auth_channel');
        bc.postMessage(message);
      } catch (e) {}

      // 2. Multi-channel dispatch: LocalStorage
      try {
        localStorage.setItem('flutter_web_auth_session', currentUrl);
        localStorage.setItem('flutter_web_auth_timestamp', String(Date.now()));
      } catch (e) {}

      // 3. Post to window.opener with retries
      var attempts = 0;
      function sendPostMessage() {
        if (window.opener) {
          try {
            window.opener.postMessage(message, window.location.origin);
          } catch (e) {}
          try {
            window.opener.postMessage(message, '*');
          } catch (e) {}
        }
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage(message, window.location.origin);
            window.parent.postMessage(message, '*');
          } catch (e) {}
        }
        attempts++;
        if (attempts < 6) {
          setTimeout(sendPostMessage, 150);
        } else if (window.opener) {
          try {
            window.close();
          } catch (e) {
            document.getElementById('return-btn').style.display = 'block';
          }
        }
      }
      sendPostMessage();

      // 4. If opened in full tab without opener (e.g. mobile Safari tab takeover), redirect to app
      if (!window.opener) {
        setTimeout(function() {
          var target = window.location.origin + '/' + window.location.search;
          window.location.replace(target);
        }, 600);
      } else {
        // Show fallback return button after 2.5s if window didn't close
        setTimeout(function() {
          var btn = document.getElementById('return-btn');
          if (btn) btn.style.display = 'block';
        }, 2500);
      }

      window.manualReturn = function() {
        try { window.close(); } catch (e) {}
        var target = window.location.origin + '/' + window.location.search;
        window.location.replace(target);
      };
    })();
  </script>
</body>
</html>

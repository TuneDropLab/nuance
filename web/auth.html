<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nuance — Authenticating</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #3D9261;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px 0;
      letter-spacing: -0.4px;
    }
    p {
      color: #8E8E93;
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Signing in to Nuance</h2>
    <p>Authenticating your account, please wait...</p>
  </div>

  <script>
    (function() {
      var currentUrl = window.location.href;
      var message = {
        'flutter-web-auth': currentUrl,
        'flutter-web-auth-2': currentUrl
      };

      var delivered = false;

      // 1. Post to window.opener (standard popup workflow)
      if (window.opener) {
        try {
          window.opener.postMessage(message, window.location.origin);
          delivered = true;
        } catch (e) {
          console.error('Error posting to opener with origin:', e);
        }
        try {
          window.opener.postMessage(message, '*');
          delivered = true;
        } catch (e) {
          console.error('Error posting to opener with wildcard:', e);
        }
      }

      // 2. Post to window.parent (if embedded in an iframe)
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(message, window.location.origin);
          window.parent.postMessage(message, '*');
          delivered = true;
        } catch (e) {
          console.error('Error posting to parent:', e);
        }
      }

      // 3. Fallback: LocalStorage
      try {
        localStorage.setItem('flutter-web-auth', currentUrl);
      } catch (e) {}

      // 4. Close popup or redirect fallback
      if (delivered && window.opener) {
        setTimeout(function() {
          try {
            window.close();
          } catch (e) {}
        }, 500);
      } else {
        // If not in a popup (e.g. redirected directly in same tab), return to app root
        setTimeout(function() {
          var target = window.location.origin + '/' + window.location.search;
          window.location.replace(target);
        }, 800);
      }
    })();
  </script>
</body>
</html>

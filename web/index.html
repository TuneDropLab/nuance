<!DOCTYPE html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="description" content="A new Flutter project." />

        <script>
          (function() {
            if (window.opener && window.location.search && (window.location.search.indexOf('session=') !== -1 || window.location.search.indexOf('error=') !== -1)) {
              try {
                var message = {
                  'flutter-web-auth': window.location.href,
                  'flutter-web-auth-2': window.location.href
                };
                window.opener.postMessage(message, window.location.origin);
                window.opener.postMessage(message, '*');
                setTimeout(function() {
                  try { window.close(); } catch (e) {}
                }, 400);
              } catch (e) {}
            }
          })();
        </script>

        <!-- iOS meta tags & icons -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="nuance" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>nuance</title>
        <link rel="manifest" href="manifest.json" />



        <meta name="theme-color" content="#000000" />
        <meta name="color-scheme" content="dark" />
        <meta
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
            name="viewport"
        />

        <style id="splash-screen-style">
            html, body {
                height: 100%;
                margin: 0;
                min-height: 100%;
                background-color: #000000 !important;
                background: #000000 !important;
                color-scheme: dark;
            }

            flt-glass-pane, flt-scene-host {
                background-color: transparent !important;
                background: transparent !important;
            }

            #splash {
                pointer-events: none;
                transition: opacity 0.4s ease-out;
            }

            .center {
                margin: 0;
                position: absolute;
                top: 50%;
                left: 50%;
                -ms-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);
            }

            .contain {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .stretch {
                display: block;
                width: 100%;
                height: 100%;
            }

            .cover {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .bottom {
                position: absolute;
                bottom: 0;
                left: 50%;
                -ms-transform: translate(-50%, 0);
                transform: translate(-50%, 0);
            }

            .bottomLeft {
                position: absolute;
                bottom: 0;
                left: 0;
            }

            .bottomRight {
                position: absolute;
                bottom: 0;
                right: 0;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #000000;
                }
            }
        </style>
        <script id="splash-screen-script">
            function removeSplashFromWeb() {
                var splash = document.getElementById("splash");
                if (splash) {
                    splash.style.opacity = "0";
                    setTimeout(function() {
                        splash.remove();
                    }, 400);
                }
                var branding = document.getElementById("splash-branding");
                if (branding) {
                    branding.remove();
                }
                document.body.style.backgroundColor = "#000000";
                document.body.style.background = "#000000";
            }
        </script>
    </head>
    <body style="background-color: #000000; background: #000000;">
        <picture id="splash">
            <source
                srcset="
                    splash/img/light-1x.png 1x,
                    splash/img/light-2x.png 2x,
                    splash/img/light-3x.png 3x,
                    splash/img/light-4x.png 4x
                "
                media="(prefers-color-scheme: light)"
            />
            <source
                srcset="
                    splash/img/dark-1x.png 1x,
                    splash/img/dark-2x.png 2x,
                    splash/img/dark-3x.png 3x,
                    splash/img/dark-4x.png 4x
                "
                media="(prefers-color-scheme: dark)"
            />
            <img
                class="center"
                aria-hidden="true"
                src="splash/img/light-1x.png"
                alt=""
            />
        </picture>

        <script>
            // Unregister any stale service workers from prior sessions to avoid caching issues
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                        registrations[i].unregister();
                    }
                }).catch(function() {});
            }
        </script>
        <script src="flutter_bootstrap.js" async></script>
    </body>
</html>
